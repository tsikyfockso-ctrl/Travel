<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôtel Nom ici - Réservation en Ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête -->
    <header>
        <div class="logo">🏨 Hôtel Nom ici</div>
        <nav>
            <a href="#" onclick="ouvrirModal(); return false;">Nos Chambres</a>
            <a href="#presentation">L'Hôtel</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Section d'Accueil / Réservation Rapide -->
    <section class="hero">
        <h1>Réservez votre séjour de rêve</h1>
        <p>Profitez des meilleurs tarifs garantis en réservant directement chez nous.</p>
        
        <div class="booking-engine">
            <div class="input-group">
                <label>Arrivée</label>
                <input type="date" id="checkin">
            </div>
            <div class="input-group">
                <label>Départ</label>
                <input type="date" id="checkout">
            </div>
            <div class="input-group">
                <label>Voyageurs</label>
                <select id="guests">
                    <option value="1">1 Adulte</option>
                    <option value="2" selected>2 Adultes</option>
                    <option value="3">3 Adultes</option>
                    <option value="4">4 Personnes (Famille)</option>
                </select>
            </div>
            <button onclick="verifierEtOuvrirChambres()">Vérifier la disponibilité</button>
        </div>
    </section>

    <!-- LA MODALE UNIQUE QUI CONTIENT TOUTES LES CHAMBRES -->
    <div id="modal-chambres" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="fermerModal()">&times;</span>
            <h2>Nos Chambres & Suites</h2>
            <p id="modal-subtitle" style="text-align:center; color:#666; margin-bottom:20px;"></p>
            
            <!-- La grille qui va regrouper les cartes des chambres dynamiquement -->
            <div id="room-list" class="grid">
                <!-- Injecté par JavaScript -->
            </div>
        </div>
    </div>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2026 Hôtel Nom ici - Tous droits réservés.</p>
        <p>Adresse : Ici | 📞 Tél : +32 488 09 13 49</p>
    </footer>

    <script src="script.js"></script>
</body>
    </html>
